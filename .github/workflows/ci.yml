name: CI

# Повний набір — у PR. PR мерджимо, лише коли гілка містить свіжий main,
# тож у main потрапляє рівно перевірене дерево: після мерджу — лише статичні перевірки й збірка,
# без повтору e2e, швидкості й доставки.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # Бюджет JS першого екрана (ADR-0009): межі маршрутів — apps/demo/bundle-budget.json.
      - run: pnpm --filter @erp-ui/demo build
      - run: pnpm check:bundle

  # e2e росте з кожним кроком (скриншоти × палітри × теми × ширини) — тому частинами паралельно.
  e2e:
    name: e2e (${{ matrix.shard }}/3)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @erp-ui/demo exec playwright install --with-deps chromium

      - run: pnpm e2e --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/demo/playwright-report
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.shard }}
          path: apps/demo/test-results/screenshots
          retention-days: 7
          if-no-files-found: ignore

  # Бюджети швидкості (ADR-0009): LCP і INP під CPU ×4 і мережею 4G, в один потік, окремо від e2e,
  # щоб паралельні тести не спотворювали заміри.
  perf:
    name: швидкість (LCP, INP)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @erp-ui/demo exec playwright install --with-deps chromium

      - run: pnpm perf

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-perf
          path: apps/demo/playwright-report
          retention-days: 7

  # Нові й змінені spec-файли ×10: тест, що падає раз на кілька прогонів, не доходить до main.
  e2e-repeat:
    name: e2e ×10 (нові й змінені файли)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find new and changed spec files
        id: specs
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/$BASE_REF...HEAD" -- 'apps/demo/e2e/*.spec.ts' | sed 's#^apps/demo/##' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.specs.outputs.files != ''

      - uses: actions/setup-node@v7
        if: steps.specs.outputs.files != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.specs.outputs.files != ''

      - name: Install Playwright Chromium
        if: steps.specs.outputs.files != ''
        run: pnpm --filter @erp-ui/demo exec playwright install --with-deps chromium

      - name: Repeat spec files
        if: steps.specs.outputs.files != ''
        env:
          FILES: ${{ steps.specs.outputs.files }}
        run: pnpm e2e:repeat $FILES --workers=2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-repeat
          path: apps/demo/playwright-report
          retention-days: 7

  # Підсумок під старою назвою: правило «перевірки мають пройти» дивиться на неї.
  checks:
    name: typecheck · lint · test · e2e
    needs: [static, e2e, e2e-repeat, perf, consumer]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          test "${{ needs.static.result }}" = success
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.e2e-repeat.result }}" = success
          test "${{ needs.perf.result }}" = success
          test "${{ needs.consumer.result }}" = success

  # Доставка в чистий проект (ADR-0004) на Node 22 (мінімум engines) і 24. Повний набір — з реєстру
  # цього коміту, зібраного локально; з GitHub — один елемент: повний набір з'їдав ліміт
  # API (~1000 запитів на годину) і давав 403.
  consumer:
    name: доставка в тестовий проект (Node ${{ matrix.node }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Лише коли змінено те, що потрапляє в проекти.
      # Збій git diff валить крок, а не пропускає перевірку мовчки.
      - name: Changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          if grep -qE '^(registry/|registry\.json|design/|scripts/consumer-smoke\.mjs|tests/consumer/|package\.json|pnpm-lock\.yaml|\.nvmrc|\.github/workflows/)' <<< "$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.relevant == 'true'

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.relevant == 'true'

      - name: Install erp-ui into a clean project
        if: steps.changes.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm consumer-smoke --local --ref ${{ github.event.pull_request.head.sha }}
