name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · test · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm --filter @erp-ui/demo exec playwright install --with-deps chromium

      - run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/demo/playwright-report
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: apps/demo/test-results/screenshots
          retention-days: 7
          if-no-files-found: ignore

  consumer:
    name: доставка в тестовий проект
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Чистий проект ставить base і всі ui/* з цього коміту приватного реєстру (ADR-0004).
      - name: Install erp-ui into a clean project
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm consumer-smoke --ref ${{ github.event.pull_request.head.sha || github.sha }}
