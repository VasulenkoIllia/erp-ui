name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # e2e росте з кожним кроком (скриншоти × палітри × теми × ширини), а раннер приватного
  # репозиторію має 2 ядра (1 потік Playwright) — тому частинами паралельно.
  e2e:
    name: e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @erp-ui/demo exec playwright install --with-deps chromium

      - run: pnpm e2e --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/demo/playwright-report
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.shard }}
          path: apps/demo/test-results/screenshots
          retention-days: 7
          if-no-files-found: ignore

  # Підсумок під старою назвою: правило «перевірки мають пройти» дивиться на неї.
  checks:
    name: typecheck · lint · test · e2e
    needs: [static, e2e, consumer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          test "${{ needs.static.result }}" = success
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.consumer.result }}" = success

  # Доставка в чистий проект (ADR-0004) на Node 22 (мінімум engines) і 24. Повний набір — з реєстру
  # цього коміту, зібраного локально; з приватного GitHub — один елемент: повний набір з'їдав ліміт
  # API (~1000 запитів на годину) і давав 403.
  consumer:
    name: доставка в тестовий проект (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # У PR — лише коли змінено те, що потрапляє в проекти; на main — завжди.
      # Збій git diff валить крок, а не пропускає перевірку мовчки.
      - name: Changed files
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          if grep -qE '^(registry/|registry\.json|design/|scripts/consumer-smoke\.mjs|tests/consumer/|package\.json|pnpm-lock\.yaml|\.nvmrc|\.github/workflows/)' <<< "$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.relevant == 'true'

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.relevant == 'true'

      - name: Install erp-ui into a clean project
        if: steps.changes.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm consumer-smoke --local --ref ${{ github.event.pull_request.head.sha || github.sha }}
