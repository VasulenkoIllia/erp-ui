name: Сторож react-hook-form

# Щотижня найновіша react-hook-form 7.x проти typecheck і тестів кіта (ADR-0077 п. 4): кіт тримає
# ~7.90.0, бо легке поле форми читає внутрішні частини бібліотеки. Червоний прогін — новіша версія
# ламає кіт (лист GitHub про збій); зелений на новішій — підстава підняти діапазон окремим PR.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/rhf-watch.yml

permissions:
  contents: read

jobs:
  latest:
    name: найновіша react-hook-form 7.x
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Latest 7.x
        id: latest
        run: |
          set -euo pipefail
          latest=$(npm view 'react-hook-form@7' version --json | node -e '
            const versions = [].concat(JSON.parse(require("node:fs").readFileSync(0, "utf8")))
            const key = (v) => v.split(".").map(Number)
            versions.sort((a, b) => { const [x, y] = [key(a), key(b)]; return x[0] - y[0] || x[1] - y[1] || x[2] - y[2] })
            console.log(versions.at(-1))')
          # Лише версія випуску 7.x: значення йде у вихід кроку й у pnpm-workspace.yaml.
          [[ "$latest" =~ ^7\.[0-9]+\.[0-9]+$ ]]
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "Найновіша react-hook-form 7.x: $latest"

      # Одна версія на весь воркспейс: і демо, і реєстр.
      - name: Install with the latest 7.x
        env:
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          printf 'overrides:\n  react-hook-form: %s\n' "$LATEST" >> pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          # Тека пакета в .pnpm — з суфіксом peer-залежностей: react-hook-form@7.92.0_react@….
          installed=$(ls node_modules/.pnpm | sed -n 's/^react-hook-form@\([0-9.]*\).*/\1/p' | sort -u)
          echo "Встановлено: ${installed:-нічого}"
          test "$installed" = "$LATEST"

      - run: pnpm typecheck
      - run: pnpm test

      - name: Summary
        env:
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          range=$(node -p "require('./registry/package.json').dependencies['react-hook-form']")
          echo "react-hook-form $LATEST: typecheck і тести зелені. Діапазон кіта — $range." >> "$GITHUB_STEP_SUMMARY"
